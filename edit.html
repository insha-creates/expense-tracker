<!DOCTYPE html>
<html>

<head>

    <title>Edit Expense</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>Edit Expense</h1>

    <form action="/update/{{ expense[0] }}" method="POST">

        <input type="text"
               name="title"
               value="{{ expense[1] }}"
               required>

        <input type="number"
               name="amount"
               value="{{ expense[2] }}"
               required>

        <input type="text"
               name="category"
               value="{{ expense[3] }}"
               required>

        <input type="date"
               name="date"
               value="{{ expense[4] }}"
               required>

        <button type="submit">
            Update Expense
        </button>

    </form>

</div>

</body>
</html>
